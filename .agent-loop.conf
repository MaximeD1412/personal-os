# Configuration de la boucle d'agents partagée (agent-loop, ~/.agents/tools/agent-loop/README.md).
# Sourcé par bash : clé=valeur, sans espace autour du signe égal.
PROJECT_NAME="Personal OS"
BASE_BRANCH=develop
CONVENTIONS_FILE=AGENTS.md
# Lancées depuis le worktree du ticket.
SETUP_CMD="scripts/worktree.sh setup"
DROP_CMD="scripts/worktree.sh drop"
# Lancé depuis le dépôt principal, après la réservation d'un ticket et après chaque merge.
PILOTAGE_PUBLISH_CMD="pilotage publish"
EXTRA_IMPLEMENT_PROMPT=""
