server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le texte voyage compressé (Lighthouse, PORTFOLIO-6). Les polices woff2
    # et les images le sont déjà.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml image/x-icon;

    # Le portfolio lit l'API sous sa propre origine, et seulement ses routes
    # publiques : le reste de l'API n'est pas joignable depuis ce domaine.
    location ^~ /api/public/ {
        proxy_pass http://api:3000/api/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ni session ni cookie : le portfolio public n'en a pas besoin.
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }

    # Les fichiers du build portent leur empreinte dans leur nom
    # (`outputHashing: all`) : ils ne changent jamais sous le même nom.
    location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html, lui, se revalide à chaque visite : il désigne les fichiers
    # du dernier build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
