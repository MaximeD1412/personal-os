server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le portfolio lit l'API sous sa propre origine, et seulement ses routes
    # publiques : le reste de l'API n'est pas joignable depuis ce domaine.
    location /api/public/ {
        proxy_pass http://api:3000/api/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ni session ni cookie : le portfolio public n'en a pas besoin.
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
