<section hlmCard class="mt-6">
  <div hlmCardHeader>
    <h2 hlmCardTitle>Fil traceur</h2>
    <p hlmCardDescription>
      L'entité jouet qui démontre le cloisonnement par Espace.
    </p>
  </div>

  <div hlmCardContent>
    <form
      class="flex flex-wrap items-end gap-2"
      (submit)="$event.preventDefault(); creer()"
    >
      <label class="flex flex-col gap-1.5">
        <span hlmLabel>Ce qu'on trace</span>
        <input
          hlmInput
          class="w-56"
          type="text"
          data-test="libelle"
          placeholder="Ce qu'on trace"
          [value]="libelle()"
          (input)="saisirLibelle($event)"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span hlmLabel>Espace</span>
        <hlm-select
          data-test="espace"
          [value]="espaceChoisi()"
          [itemToString]="nomDeLEspace"
          (valueChange)="choisirEspace($event)"
        >
          <hlm-select-trigger class="w-56">
            <hlm-select-value placeholder="Choisir un Espace" />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            @for (espace of espaces(); track espace.id) {
            <hlm-select-item [value]="espace.id"
              >{{ espace.label }}</hlm-select-item
            >
            }
          </hlm-select-content>
        </hlm-select>
      </label>

      <button hlmBtn type="submit" data-test="creer" [disabled]="!pretACreer()">
        Ajouter
      </button>
    </form>

    @if (erreur(); as message) {
    <p class="text-destructive mt-3 text-sm">{{ message }}</p>
    }

    <ul class="mt-4 divide-y">
      @for (trace of traces(); track trace.id) {
      <li class="flex flex-wrap items-baseline gap-3 py-2">
        <span class="flex-1 text-sm">{{ trace.label }}</span>
        <span hlmBadge variant="secondary"
          >{{ nomDeLEspace(trace.scopeId) }}</span
        >
        <button
          hlmBtn
          variant="ghost"
          size="sm"
          type="button"
          data-test="supprimer"
          (click)="supprimer(trace.id)"
        >
          Supprimer
        </button>
      </li>
      } @empty {
      <li class="text-muted-foreground py-2 text-sm">
        Aucune Trace dans vos Espaces.
      </li>
      }
    </ul>
  </div>
</section>
