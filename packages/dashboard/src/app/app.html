<main class="mx-auto max-w-4xl px-4 py-8">
  <header
    class="border-border flex flex-wrap items-baseline justify-between gap-4 border-b pb-4"
  >
    <h1 class="text-2xl font-semibold tracking-tight">Tableau de bord</h1>

    @if (nom(); as compte) {
    <p class="flex items-baseline gap-3">
      <span class="text-muted-foreground text-sm">{{ compte }}</span>
      <button
        hlmBtn
        variant="outline"
        size="sm"
        type="button"
        data-test="deconnexion"
        (click)="seDeconnecter()"
      >
        Se déconnecter
      </button>
    </p>
    }
  </header>

  @if (probe(); as sonde) {
  <p class="text-muted-foreground mt-4 text-sm">
    Sonde lue en base :
    <strong class="text-foreground">{{ sonde.label }}</strong>
    <small>(enregistrée le {{ sonde.recordedAt }})</small>
  </p>
  } @else if (error(); as message) {
  <p class="text-destructive mt-4 text-sm">{{ message }}</p>
  } @else {
  <p class="text-muted-foreground mt-4 text-sm">Lecture de la sonde…</p>
  }

  <nav class="mt-6 flex gap-2">
    <a
      hlmBtn
      variant="ghost"
      size="sm"
      data-test="vers-agenda"
      routerLink="/agenda"
      routerLinkActive="bg-muted text-foreground"
      >Agenda</a
    >
    <a
      hlmBtn
      variant="ghost"
      size="sm"
      data-test="vers-calendrier"
      routerLink="/calendrier"
      routerLinkActive="bg-muted text-foreground"
      >Calendrier</a
    >
    <a
      hlmBtn
      variant="ghost"
      size="sm"
      data-test="vers-fil-traceur"
      routerLink="/fil-traceur"
      routerLinkActive="bg-muted text-foreground"
      >Fil traceur</a
    >
  </nav>

  <router-outlet></router-outlet>
</main>
