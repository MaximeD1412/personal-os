<main class="tableau-de-bord">
  <header class="entete">
    <h1>Tableau de bord</h1>

    @if (nom(); as compte) {
    <p class="compte">
      <span class="qui">{{ compte }}</span>
      <button type="button" data-test="deconnexion" (click)="seDeconnecter()">
        Se déconnecter
      </button>
    </p>
    }
  </header>

  @if (probe(); as sonde) {
  <p class="sonde">
    Sonde lue en base : <strong>{{ sonde.label }}</strong>
    <small>(enregistrée le {{ sonde.recordedAt }})</small>
  </p>
  } @else if (error(); as message) {
  <p class="erreur">{{ message }}</p>
  } @else {
  <p class="attente">Lecture de la sonde…</p>
  }

  <nav class="modules">
    <a data-test="vers-calendrier" routerLink="/calendrier">Calendrier</a>
    <a data-test="vers-fil-traceur" routerLink="/fil-traceur">Fil traceur</a>
  </nav>

  <router-outlet></router-outlet>
</main>
