<dccm-shell>
  <dccm-top-bar
    [scopes]="optionsDEspace()"
    [scope]="espaceChoisi()"
    (scopeChange)="choisirLEspace($event)"
    [userName]="nom()"
    (logout)="seDeconnecter()"
  >
    <!-- La zone de recherche : la barre de commande (CMD-3) s'y logera. -->
  </dccm-top-bar>

  <dccm-sidebar [groups]="groupes" [footer]="pied" [status]="etat()" />
  <dccm-sidebar
    variant="rail"
    [groups]="groupes"
    [footer]="pied"
    [status]="etat()"
  />

  <dccm-mobile-header [status]="etat()">
    <!-- Le bouton de commande (CMD-3) s'y logera, en [dccmMobileHeaderCommand]. -->
  </dccm-mobile-header>

  <dccm-tab-bar [entries]="onglets">
    <hlm-sheet side="left" class="contents">
      <button
        hlmSheetTrigger
        dccmTabBarItem
        data-test="plus"
        icon="matMoreHorizOutline"
        label="Plus"
      ></button>
      <hlm-sheet-content
        *hlmSheetPortal="let panneau"
        class="w-72 gap-0 overflow-y-auto p-0"
      >
        <div hlmSheetHeader class="gap-space-md pe-14">
          <h2 hlmSheetTitle>Navigation</h2>
          @if (optionsDEspace().length) {
          <hlm-toggle-group
            size="md"
            aria-label="Espace des nouvelles saisies"
            class="self-start"
            [value]="espaceChoisi()"
            (valueChange)="choisirLEspace($any($event))"
          >
            @for (espace of optionsDEspace(); track espace.value) {
            <button hlmToggleGroupItem [value]="espace.value">
              {{ espace.label }}
            </button>
            }
          </hlm-toggle-group>
          }
        </div>

        <dccm-sidebar
          class="h-auto w-full flex-1"
          [groups]="groupes"
          [footer]="pied"
          [status]="etat()"
          (navigate)="panneau.close()"
        />

        @if (nom(); as compte) {
        <div
          class="flex items-center justify-between gap-space-sm border-t border-surface-container-highest p-gutter"
        >
          <span
            class="truncate text-label-regular font-semibold text-on-surface"
            >{{ compte }}</span
          >
          <button
            hlmBtn
            variant="ghost"
            size="sm"
            type="button"
            data-test="deconnexion-mobile"
            (click)="seDeconnecter()"
          >
            <ng-icon name="matLogoutOutline" aria-hidden="true" />
            Déconnexion
          </button>
        </div>
        }
      </hlm-sheet-content>
    </hlm-sheet>
  </dccm-tab-bar>

  <router-outlet />
</dccm-shell>
