server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le tableau de bord appelle l'API sous le même hôte : pas de CORS en
    # production, et le cookie de session reste strictement de première partie.
    # Les routes internes de l'API (l'agent de sauvegarde y transmet son état)
    # ne sortent pas sur Internet : l'agent les appelle sur le port de l'API,
    # depuis la machine. Une expression l'emporte sur le préfixe `/api/`, et
    # elle ignore la casse, comme le routage d'Express.
    location ~* ^/api/+internal(/|$) {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
