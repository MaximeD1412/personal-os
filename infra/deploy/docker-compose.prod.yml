# Pile de production. S'installe en /opt/personal-os/docker-compose.yml.
#
# Ce fichier ne construit rien : il **tire** des images déjà construites et
# testées par la livraison (ADR 0023). C'est la différence avec le
# docker-compose.yml de la racine, qui construit et sert le poste local — et
# c'est pourquoi les deux ne sont pas superposés par un fichier d'override :
# lire la configuration de production ne doit pas demander de tenir deux
# fichiers en tête.
#
# `IMAGE_TAG` est **toujours** une révision précise, jamais un tag mouvant :
# c'est ce qui donne au retour arrière une cible stable (ADR 0024).
#
# Règle de publication : seul le proxy de tête écoute sur une interface
# publique. Tout ce qui est ici est sur loopback, joignable par le proxy ou par
# tunnel SSH, et rien d'autre.

services:
  db:
    image: postgres:18-alpine
    container_name: personal-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      # Postgres 18+ attend le montage sur le répertoire parent : les données
      # vivent dans un sous-répertoire nommé d'après la version majeure.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Un seul serveur PostgreSQL, deux bases : celle de l'application et celle
  # d'Authentik. Le VPS est partagé et contraint, et une seule instance se
  # sauvegarde d'un seul geste (POSTGRES_DATABASES dans backup.conf).
  #
  # Ce service n'est pas dans /docker-entrypoint-initdb.d : celui-ci ne tourne
  # que sur un volume vierge, or celui de production existe depuis #2. Une
  # étape qui ne s'exécute que sur une installation neuve est une étape qu'on
  # oublie le jour d'une restauration. Ici elle est idempotente et rejouée à
  # chaque déploiement.
  db-init:
    image: postgres:18-alpine
    container_name: personal-os-db-init
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_DB: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?AUTHENTIK_POSTGRES_PASSWORD manquant}
    entrypoint: ['/bin/sh', '-c']
    # `%I` cite comme identifiant, `%L` comme littéral : un mot de passe portant
    # une apostrophe ne sort pas de sa chaîne.
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -d postgres \
          -v u="$$AUTHENTIK_USER" -v p="$$AUTHENTIK_PASSWORD" -v d="$$AUTHENTIK_DB" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'u', :'p')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'u') \gexec
        ALTER ROLE :"u" WITH LOGIN PASSWORD :'p';
        SELECT format('CREATE DATABASE %I OWNER %I', :'d', :'u')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'d') \gexec
        SQL

  # Authentik n'a plus besoin de Redis depuis 2025 : il tient ses files et son
  # cache dans PostgreSQL. Le socket Docker de la composition officielle n'est
  # pas monté non plus — il ne sert qu'aux outposts, et Personal OS est un
  # client OIDC ordinaire (ADR 0015). Le monter donnerait à l'IdP la main sur
  # toute la machine, celle-là même qui héberge fiches de paie et documents.
  #
  # Ses données sont en montage lié, et non en volume Docker : la sauvegarde
  # emporte des chemins (BACKUP_PATHS), pas des volumes.
  authentik:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.5.6}
    container_name: personal-os-authentik
    command: server
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment: &authentik-env
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY manquant}
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_DISABLE_UPDATE_CHECK: 'true'
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: 'true'
    ports:
      - '127.0.0.1:${AUTHENTIK_PORT:-9000}:9000'
    volumes:
      - ${AUTHENTIK_DIR:-/opt/personal-os/authentik}/data:/data
      - ${AUTHENTIK_DIR:-/opt/personal-os/authentik}/templates:/templates

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.5.6}
    container_name: personal-os-authentik-worker
    command: worker
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment: *authentik-env
    volumes:
      - ${AUTHENTIK_DIR:-/opt/personal-os/authentik}/data:/data
      - ${AUTHENTIK_DIR:-/opt/personal-os/authentik}/certs:/certs
      - ${AUTHENTIK_DIR:-/opt/personal-os/authentik}/templates:/templates

  api:
    image: ${REGISTRY:?REGISTRY manquant}/api:${IMAGE_TAG:?IMAGE_TAG manquant}
    container_name: personal-os-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      # Le tableau de bord appelle l'API sous son propre hôte, via son nginx :
      # en production il n'y a pas de requête inter-origine à autoriser.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # L'API est un client OIDC ordinaire (ADR 0015). Elle joint Authentik par
      # le réseau interne, mais l'émetteur reste le nom **public** : c'est la
      # chaîne que porte le `iss` des jetons, et celle où le navigateur est
      # envoyé. Les deux doivent coïncider.
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER manquant}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-personal-os}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET manquant}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?OIDC_REDIRECT_URI manquant}
      DASHBOARD_URL: ${DASHBOARD_URL:?DASHBOARD_URL manquant}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:?AUTH_ALLOWED_EMAILS manquant}
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3000'

  dashboard:
    image: ${REGISTRY}/dashboard:${IMAGE_TAG}
    container_name: personal-os-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '127.0.0.1:${DASHBOARD_PORT:-4200}:80'

  portfolio:
    image: ${REGISTRY}/portfolio:${IMAGE_TAG}
    container_name: personal-os-portfolio
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '127.0.0.1:${PORTFOLIO_PORT:-4201}:80'

  # Proxy interne de Personal OS. Il ne termine pas TLS : le proxy de tête de la
  # machine s'en charge et lui transmet le trafic par le réseau `edge`
  # (ADR 0025). Son intérêt est ailleurs — la carte de routage de Personal OS
  # vit dans **ce dépôt**, versionnée et déployée par l'agent.
  #
  # C'est ce qui permet d'ajouter un sous-domaine sans toucher à l'edge : il
  # reçoit tout le domaine et laisse ce conteneur décider.
  #
  # À la migration vers le homelab, il reprend TLS : on change les adresses de
  # site, pas l'architecture.
  caddy:
    image: caddy:2-alpine
    container_name: personal-os-caddy
    restart: unless-stopped
    depends_on:
      - dashboard
      - portfolio
    environment:
      PORTFOLIO_HOST: ${PORTFOLIO_HOST:?PORTFOLIO_HOST manquant}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-}
      AUTHENTIK_HOST: ${AUTHENTIK_HOST:-}
    # L'edge joint ce conteneur par son nom, sur le réseau partagé. Le port
    # publié ne sert donc plus qu'à déboguer depuis l'hôte — un conteneur ne
    # peut pas joindre un port publié sur 127.0.0.1, c'est le loopback de
    # l'hôte, pas le sien.
    ports:
      - '127.0.0.1:${CADDY_PORT:-8080}:80'
    volumes:
      - ${CADDY_DIR:-/opt/personal-os/caddy}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DIR:-/opt/personal-os/caddy}/conf.d:/etc/caddy/conf.d:ro
    networks:
      # `default` doit être répété : dès qu'un service nomme ses réseaux, il ne
      # rejoint plus celui par défaut tout seul — et il perdrait l'accès au
      # tableau de bord et au portfolio.
      - default
      - edge

networks:
  # Créé par le projet de l'edge, jamais par celui-ci : l'edge démarre en
  # premier. Le déclarer externe fait échouer le déploiement avec un message
  # clair si l'ordre n'est pas respecté, plutôt que de créer en silence un
  # second réseau du même nom où personne ne se parle.
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge}

volumes:
  db-data:
