name: Vérification

# Campagne unique, appelée par la CI des branches de travail et par la
# livraison. Elle a deux portées, et la différence entre les deux est le seul
# endroit où le contrat se joue :
#
#   - « complete » rejoue tout. C'est ce que la livraison demande, et c'est ce
#     qui rend vraie la phrase « rien n'est poussé sur GHCR sans avoir passé la
#     campagne entière ».
#   - « affectee » ne fait tourner que ce que le diff atteint réellement. Une
#     proposition qui ne touche que le tableau de bord n'a aucune raison de
#     rejouer quatre-vingt-seize secondes de chaîne de déploiement.
#
# Le filet, c'est que la branche principale ne connaît que la première portée :
# ce qu'une proposition a sauté sera de toute façon rejoué avant publication.
on:
  workflow_call:
    inputs:
      portee:
        description: '« complete » rejoue toute la campagne, « affectee » ne prend que ce que le diff touche'
        type: string
        required: false
        default: affectee

env:
  # Les deux portées ne diffèrent que par le verbe passé à Nx : le reste de la
  # ligne de commande — cibles, filtres de projet — reste mot pour mot le même,
  # pour qu'aucune des deux ne puisse mesurer autre chose que l'autre.
  NX: ${{ inputs.portee == 'complete' && 'run-many' || 'affected' }}

jobs:
  # Plusieurs jobs plutôt qu'un, parce qu'ils n'ont aucune dépendance entre eux
  # et que le dépôt est public : les minutes sont gratuites, et les enchaîner
  # sur un seul coureur ne payait que du temps d'attente. Le découpage suit le
  # coût réel, pas la logique : le banc de déploiement pèse à lui seul plus que
  # tout le reste, il a donc son coureur.

  # Des agents commitent sans relecture humaine du code : un secret commité
  # doit faire échouer la proposition avant la fusion. Le scan ne dépend pas
  # de la portée, il lit l'historique que l'événement apporte (les commits de
  # la proposition, ou ceux du push).
  secrets:
    name: Cherche des secrets dans l'historique
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Un secret ajouté puis retiré dans la même proposition reste dans
          # l'historique : c'est lui qu'on scanne, pas le seul dernier état.
          fetch-depth: 0

      # gitleaks honore par défaut un commentaire d'exception en ligne et un
      # fichier .gitleaksignore, et l'action ne permet pas de les désactiver.
      # Les deux contourneraient la revue : une exception passe par
      # .gitleaks.toml, et nulle part ailleurs.
      - name: Refuser les exceptions hors de .gitleaks.toml
        run: |
          if [ -e .gitleaksignore ]; then
            echo "::error::.gitleaksignore est refusé : une exception s'écrit dans .gitleaks.toml."
            exit 1
          fi
          # --diff-merges : un marqueur ajouté en résolvant une fusion compte
          # aussi.
          commits=$(git log -G 'gitleaks[:]allow' --diff-merges=first-parent --no-patch --format='%h %s' HEAD)
          if [ -n "$commits" ]; then
            echo "::error::Commentaire d'exception gitleaks refusé : une exception s'écrit dans .gitleaks.toml."
            echo "$commits"
            exit 1
          fi

      - name: Scanner avec gitleaks
        # v3.0.0, épinglée par SHA : un tag déplacé ferait tourner un autre
        # code avec le jeton du dépôt.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
          # Le commentaire de l'action propose d'ajouter l'empreinte à
          # .gitleaksignore, justement ce que l'étape précédente refuse. Et le
          # jeton n'a pas le droit d'écrire sur la proposition.
          GITLEAKS_ENABLE_COMMENTS: false

      # L'action ne voit pas tout l'historique de la proposition : elle ne lit
      # que les 30 premiers commits que l'API lui renvoie, et passe à gitleaks
      # --first-parent --no-merges. Un jeton au 31e commit, sur une branche
      # fusionnée dans la proposition ou ajouté en résolvant une fusion lui
      # échappe. Ce second passage prend la plage entière depuis les SHA de
      # l'événement, tous les parents, et le diff de chaque fusion contre son
      # premier parent.
      - name: Scanner toute la plage, fusions comprises
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          TETE_PR: ${{ github.event.pull_request.head.sha }}
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.event.after }}
        run: |
          case "$EVENEMENT" in
            pull_request) plage="$BASE_PR..$TETE_PR" ;;
            # Un push dont la base est inconnue (nouvelle branche, historique
            # réécrit) reprend tout ce qui mène à sa tête.
            push) if git cat-file -e "$AVANT^{commit}" 2>/dev/null; then plage="$AVANT..$APRES"; else plage="$APRES"; fi ;;
            *) plage=HEAD ;;
          esac
          echo "Plage scannée : $plage"
          gitleaks git . --config .gitleaks.toml --no-banner --redact --log-opts="--diff-merges=first-parent $plage"

      # Un scan qui ne trouve rien ne prouve rien si la configuration a cessé
      # de chercher (exception trop large, fichier illisible). On lui donne
      # donc un jeton factice au format réel, fabriqué ici pour qu'aucun
      # n'existe dans le dépôt, et on exige qu'il le signale.
      - name: Vérifier que le scan attrape un vrai format de jeton
        run: |
          leurre=$(mktemp -d)
          printf 'GITHUB_TOKEN=ghp_%s\n' "$(openssl rand -hex 18)" > "$leurre/config.env"
          code=0
          gitleaks dir "$leurre" --config .gitleaks.toml --no-banner --redact --exit-code 3 || code=$?
          if [ "$code" -ne 3 ]; then
            echo "::error::Le scan n'a pas signalé un jeton GitHub factice (code $code)."
            exit 1
          fi

  statique:
    name: Lint, construit et teste
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # `nx affected` compare deux commits. Un clone superficiel n'aurait
          # rien à comparer.
          fetch-depth: 0

      - uses: ./.github/actions/preparer
        with:
          affectee: ${{ inputs.portee != 'complete' }}

      - name: Lint
        run: pnpm exec nx $NX -t lint

      - name: Construire
        run: pnpm exec nx $NX -t build

      # Le catalogue de la barre de commande est versionné, pour que le front
      # et l'API le lisent sans exécuter l'API (ADR 0018). Il est donc
      # régénéré ici quelle que soit la portée, et doit être identique à celui
      # du commit : une annotation modifiée sans régénération ferait mentir le
      # fichier.
      - name: Vérifier le catalogue de la barre de commande
        run: |
          pnpm exec nx run api:command-catalog
          catalogue=packages/contracts/src/generated/command-catalog.json
          if [ -n "$(git status --porcelain -- "$catalogue")" ]; then
            echo "::error::Le catalogue versionné n'est pas à jour : lancer \`pnpm exec nx run api:command-catalog\` et commiter $catalogue."
            git diff -- "$catalogue"
            exit 1
          fi

      - name: Tests unitaires
        run: pnpm exec nx $NX -t test

  integration:
    name: Éprouve l'API et les sauvegardes sur de vraies pièces
    runs-on: ubuntu-latest

    env:
      # La base jetable des tests d'intégration de l'API est créée sur ce
      # serveur. Les sauvegardes, elles, montent le leur.
      TEST_DATABASE_URL: postgresql://personalos:personalos@localhost:5432/postgres?schema=public

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: personalos
          POSTGRES_PASSWORD: personalos
          POSTGRES_DB: personalos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personalos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/preparer
        with:
          affectee: ${{ inputs.portee != 'complete' }}

      # Le va-et-vient de sauvegarde exerce le vrai binaire : le simuler
      # reviendrait à tester la simulation, et c'est précisément la restauration
      # qu'on ne peut pas se permettre de croire sur parole.
      - name: Installer restic
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends restic

      # La copie du bucket s'éprouve sous un /tmp privé, comme sous
      # PrivateTmp=yes : le test l'isole par `unshare --user`, qu'AppArmor
      # refuse sans privilège sur les runners Ubuntu récents.
      - name: Autoriser les espaces de noms utilisateur
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Tests d'intégration sur base jetable
        run: pnpm exec nx $NX -t test-integration --exclude=deploy

  deploiement:
    name: Rejoue la chaîne de déploiement de bout en bout
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/preparer
        with:
          affectee: ${{ inputs.portee != 'complete' }}

      # Le banc monte sa propre pile — registre, images, dépôt Git, base — donc
      # aucun service ici. Il appelle restore.sh, d'où restic.
      - name: Installer restic
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends restic

      - name: Banc de déploiement
        run: pnpm exec nx $NX -t test-integration --exclude='*,!deploy'
