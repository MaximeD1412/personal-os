name: Livraison

# Un commit atteignant la branche principale part en production (ADR 0023 pour
# la séquence, ADR 0032 pour son déclenchement).
#
# Les images sont publiées sous le SHA, le canal `main` est promu, puis le job
# `production` demande au VPS de déployer ce commit. Il le fait par une clé SSH
# bridée : elle ne peut lancer que « deploy prod <sha> », sans shell, sans
# redirection, sans lecture des secrets de la machine. Elle n'est lisible que
# par l'environnement GitHub protégé `production`, réservé à `main`. La
# répétition sur restauration, la migration, la santé et le retour arrière
# s'exécutent sur le VPS, pendant le job : il est rouge si la production n'a
# pas suivi.
on:
  push:
    branches: [main]

# Deux livraisons ne se doublent pas : la seconde attend que la première ait
# fini de promouvoir son canal et de déployer, sinon la production pourrait
# reculer.
concurrency:
  group: livraison
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    # Campagne entière, sans filtre : rien ne part sur GHCR sans avoir passé la
    # totalité des tests, y compris ceux qu'aucun diff de la branche n'aurait
    # désignés.
    with:
      portee: complete

  publier:
    needs: verify
    uses: ./.github/workflows/publier-images.yml
    with:
      images: '["api","dashboard","portfolio","edge"]'

  promouvoir:
    name: Promeut le lot complet sur le canal
    needs: publier
    runs-on: ubuntu-latest
    steps:
      - name: Se connecter à GHCR
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' |
            docker login ghcr.io --username '${{ github.actor }}' --password-stdin

      # Le canal ne bouge qu'ici, une fois toutes les images poussées. Un échec
      # de construction sur une seule d'entre elles laisse donc le canal sur la
      # version précédente, et rien n'est déployé — plutôt qu'un lot dépareillé
      # où l'API a avancé et le tableau de bord non. Le canal reste ce que
      # deploy.sh lit quand on le lance à la main, sans commit.
      - name: Déplacer le canal
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          for image in api dashboard portfolio edge; do
            # Recopie de manifeste, côté registre : rien n'est retéléchargé.
            docker buildx imagetools create \
              --tag "${registry}/${image}:${CHANNEL}" \
              "${registry}/${image}:${GITHUB_SHA}"
          done
          echo "canal ${CHANNEL} promu sur ${GITHUB_SHA}"
        env:
          CHANNEL: main

  production:
    name: Déploie la production
    needs: promouvoir
    runs-on: ubuntu-latest
    # Environnement protégé, restreint à `main` : seul ce job lit PROD_SSH_KEY.
    environment: production
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/deployer
        with:
          environnement: prod
          cle: ${{ secrets.PROD_SSH_KEY }}
          hote: ${{ vars.DEPLOY_HOST }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
