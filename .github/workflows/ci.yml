name: CI

# Branches de travail et propositions de fusion. La branche principale, elle,
# est une branche de livraison : elle est traitée par livraison.yml
# (ADR 0023).
on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  images:
    name: Construit les images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Construire les images
        run: docker compose build
