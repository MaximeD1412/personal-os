name: CI

# Branches de travail et propositions de fusion. La branche principale, elle,
# est une branche de livraison : elle est traitée par livraison.yml
# (ADR 0023).
#
# Un push sur `develop` déploie en plus le staging de démonstration (ADR 0031,
# 0032) : images publiées sous le SHA, puis déploiement par la clé bridée du
# staging. Le job est rouge si le déploiement échoue.
on:
  push:
    branches: [develop]
  pull_request:

# Une proposition poussée à nouveau annule sa vérification précédente. Un push
# sur `develop`, non : l'annuler couperait un déploiement du staging en route.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # nx-set-shas remonte à la dernière exécution réussie pour savoir depuis où
  # comparer : sur un push, c'est la seule base qui ne laisse pas filer ce
  # qu'une exécution en échec n'a jamais vérifié.
  actions: read
  contents: read
  # Le scan de secrets demande à l'API la liste des commits de la
  # proposition. Le dépôt public s'en passerait, pas un dépôt privé.
  pull-requests: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    # Une proposition vers `develop` ne rejoue que ce que son diff atteint. Ce
    # qu'elle saute est rejoué la nuit suivante (nightly.yml), puis par la
    # proposition de livraison : celle qui vise `main` rejoue tout, pour que la
    # fusion ne découvre pas l'échec que la livraison trouverait juste après.
    with:
      portee: ${{ github.base_ref == 'main' && 'complete' || 'affectee' }}

  images:
    name: Construit les images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Construire les images
        run: docker compose build

  edge:
    name: Construit le proxy de tête et valide son routage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Construire l'image
        run: docker build --file infra/edge/Dockerfile --tag personal-os-edge:ci infra/edge

      # `caddy validate` contre l'image **construite**, pas contre le Caddy
      # standard : la directive `dns ovh` n'existe que dans celle-ci. Valider
      # ailleurs ne prouverait rien, et la faute ne se verrait que sur la
      # machine — c'est-à-dire au moment où le proxy de tête refuse de démarrer
      # et où plus rien n'est joignable.
      #
      # Les identifiants sont factices : la validation lit la configuration,
      # elle ne contacte personne.
      - name: Valider le Caddyfile
        run: |
          docker run --rm \
            --env ACME_EMAIL=ci@exemple.test \
            --env PERSONAL_OS_DOMAIN=exemple.test \
            --env PERSONAL_OS_UPSTREAM=personal-os-caddy:80 \
            --env OVH_ENDPOINT=ovh-eu \
            --env OVH_APPLICATION_KEY=cle \
            --env OVH_APPLICATION_SECRET=secret \
            --env OVH_CONSUMER_KEY=consommateur \
            --volume "$PWD/infra/edge/Caddyfile:/etc/caddy/Caddyfile:ro" \
            personal-os-edge:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  publier:
    name: Publie les images du staging
    if: github.event_name == 'push'
    needs: verify
    uses: ./.github/workflows/publier-images.yml
    permissions:
      contents: read
      packages: write
    with:
      images: '["api","dashboard","portfolio"]'

  staging:
    name: Déploie le staging
    if: github.event_name == 'push'
    needs: publier
    runs-on: ubuntu-latest
    # Le secret STAGING_SSH_KEY et les variables DEPLOY_HOST, DEPLOY_KNOWN_HOSTS
    # ne sont lisibles que par les jobs de cet environnement.
    environment: staging
    concurrency:
      group: deploiement-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/deployer
        with:
          environnement: staging
          cle: ${{ secrets.STAGING_SSH_KEY }}
          hote: ${{ vars.DEPLOY_HOST }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
